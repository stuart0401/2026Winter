<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 東京冬令營</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a picture-book diary — paper page, crayon-outlined cards, one illustration per stop, fixed bottom nav. */
:root{
  --paper:#f5eee1;
  --card:#fffaf1;
  --ink:#4b3a30;
  --ink-soft:#7d6a5c;
  --accent:#d8613f;      /* persimmon */
  --accent-2:#5b8a74;    /* pine */
  --line:#d9cbb6;
  --chip:#efe3cf;
  --a-group:#d8613f;
  --b-group:#4f7fa6;
  /* illustration palette */
  --sky:#cfe3e8; --cloud:#fffdf6; --snow:#ffffff; --sun:#f3c86a;
  --red:#d8613f; --brick:#c26b4f; --green:#8db58a; --pine:#5b8a74; --yellow:#f3c86a;
  --brown:#b98559; --wood:#d7a877; --pink:#f0b4a3; --blue:#7fa8c7; --stone:#bdb4a5;
  --night:#36406a; --glow:#ffd98a; --ground:#e8dcc3; --water:#9cc4d4; --copper:#c8844c;
  --font-body:"Roboto","Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --font-display:"Roboto","Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --radius:22px;
  --shadow:0 3px 0 var(--line);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c2133; --card:#262c42; --ink:#efe6d6; --ink-soft:#b5ab9c; --accent:#f08b67; --accent-2:#86bba1;
    --line:#3a4260; --chip:#323a55; --a-group:#f08b67; --b-group:#8db8dc;
    --sky:#2d375a; --cloud:#46507a; --snow:#e3e8f2; --sun:#f6e3a8;
    --red:#e07a5c; --brick:#c87a62; --green:#6f9c7e; --pine:#4f7d6b; --yellow:#f3cf7c;
    --brown:#a8805e; --wood:#b78f68; --pink:#d79a8c; --blue:#7c9fc4; --stone:#8f8b8a;
    --night:#1a1f36; --glow:#ffd98a; --ground:#3b4058; --water:#4a6f8c; --copper:#d0915a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1c2133; --card:#262c42; --ink:#efe6d6; --ink-soft:#b5ab9c; --accent:#f08b67; --accent-2:#86bba1;
  --line:#3a4260; --chip:#323a55; --a-group:#f08b67; --b-group:#8db8dc;
  --sky:#2d375a; --cloud:#46507a; --snow:#e3e8f2; --sun:#f6e3a8;
  --red:#e07a5c; --brick:#c87a62; --green:#6f9c7e; --pine:#4f7d6b; --yellow:#f3cf7c;
  --brown:#a8805e; --wood:#b78f68; --pink:#d79a8c; --blue:#7c9fc4; --stone:#8f8b8a;
  --night:#1a1f36; --glow:#ffd98a; --ground:#3b4058; --water:#4a6f8c; --copper:#d0915a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 0);
  background-size:14px 14px;
}
.wrap{max-width:1120px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.04em}
.brand-dot{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--card);border:2px solid var(--ink)}
.theme-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.theme-btn svg{width:18px;height:18px}

/* views */
.view{display:none}
.view.active{display:block}

/* illustration base */
.illus{display:block;width:100%;height:auto}
.illus .ink{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.illus .ink-f{stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.illus .thin{stroke-width:1.8}
.illus .dash{stroke-dasharray:6 7}
.illus .nofill{fill:none}
.c-sky{fill:var(--sky)}.c-cloud{fill:var(--cloud)}.c-snow{fill:var(--snow)}.c-sun{fill:var(--sun)}
.c-red{fill:var(--red)}.c-brick{fill:var(--brick)}.c-green{fill:var(--green)}.c-pine{fill:var(--pine)}
.c-yellow{fill:var(--yellow)}.c-brown{fill:var(--brown)}.c-wood{fill:var(--wood)}.c-pink{fill:var(--pink)}
.c-blue{fill:var(--blue)}.c-stone{fill:var(--stone)}.c-night{fill:var(--night)}.c-glow{fill:var(--glow)}
.c-ground{fill:var(--ground)}.c-water{fill:var(--water)}.c-copper{fill:var(--copper)}.c-card{fill:var(--card)}.c-ink{fill:var(--ink)}
.c-paper{fill:var(--paper)}

/* home */
.hero{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:0 5px 0 var(--line);display:grid;grid-template-columns:1fr}
.hero-art{border-bottom:2.5px solid var(--ink)}
.hero-body{padding:22px 22px 24px;display:grid;gap:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:.02em}
.hero p{margin:0;color:var(--ink-soft);max-width:60ch}
.count{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.count b{font-size:44px;font-weight:900;color:var(--accent);line-height:1}
.count span{color:var(--ink-soft);font-size:15px}
@media (min-width:860px){
  .hero{grid-template-columns:1.25fr 1fr}
  .hero-art{border-bottom:0;border-right:2.5px solid var(--ink)}
  .hero-body{align-content:center;padding:32px}
}

.section-title{display:flex;align-items:center;gap:10px;margin:34px 0 14px;font-size:20px;font-weight:700}
.section-title::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--accent-2);border:2px solid var(--ink);flex:none}

.flights{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.flight{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:8px}
.flight-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft)}
.flight-no{font-weight:900;font-size:18px;color:var(--ink);letter-spacing:.04em}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.route .t{font-size:28px;font-weight:700;line-height:1}
.route .p{font-size:13px;color:var(--ink-soft)}
.route .line{height:0;border-top:2.5px dashed var(--ink-soft);position:relative}
.route .line::after{content:"✈";position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:16px;color:var(--accent);background:var(--card);padding:0 4px}
.note-small{font-size:13px;color:var(--ink-soft);margin:6px 0 0}

.days-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.day-tile{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px 10px 10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.day-tile:hover{transform:translateY(-2px)}
.day-tile .mini{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sky)}
.day-tile .d{font-weight:900;font-size:17px}
.day-tile .d small{font-weight:500;color:var(--ink-soft);font-size:13px;margin-left:4px}
.day-tile .th{font-size:14px;color:var(--ink-soft);line-height:1.45}
.stay-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stay{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.stay b{display:block;font-size:16px}
.stay span{font-size:14px;color:var(--ink-soft)}

/* trip view */
.day-picker{position:sticky;top:0;z-index:5;margin:0 -20px 18px;padding:10px 20px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.day-picker::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.chip small{font-weight:500;color:var(--ink-soft);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff8ee;border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:#fff8ee}

.day-head{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:0 5px 0 var(--line);display:grid;grid-template-columns:1fr;margin-bottom:18px}
.day-head .art{border-bottom:2.5px solid var(--ink)}
.day-head .body{padding:18px 20px;display:grid;gap:8px;align-content:center}
.day-head h2{font-size:clamp(22px,4vw,30px);font-weight:900}
.day-head .date{font-weight:700;color:var(--accent);letter-spacing:.06em;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);border-radius:999px;padding:3px 11px;font-weight:500}
.tag.spot{background:color-mix(in srgb,var(--accent-2) 22%,var(--card));color:var(--ink)}
.tag.opt{background:color-mix(in srgb,var(--yellow) 35%,var(--card))}
.tag.a{background:color-mix(in srgb,var(--a-group) 22%,var(--card))}
.tag.b{background:color-mix(in srgb,var(--b-group) 22%,var(--card))}
.callout{border:2px dashed var(--ink-soft);border-radius:16px;padding:12px 16px;font-size:14.5px;color:var(--ink);background:color-mix(in srgb,var(--card) 60%,transparent);margin:0 0 18px;max-width:75ch}
.callout b{color:var(--accent)}
@media (min-width:860px){
  .day-head{grid-template-columns:1.1fr 1fr}
  .day-head .art{border-bottom:0;border-right:2.5px solid var(--ink)}
  .day-head .body{padding:24px 28px}
}

.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr;position:relative}
.card .art{border-bottom:2.5px solid var(--ink);background:var(--sky)}
.card .body{padding:14px 16px 16px;display:grid;gap:6px;align-content:start}
.time{position:absolute;top:10px;left:10px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.card h3{font-size:18px;font-weight:700}
.card p{margin:0;font-size:14.5px;color:var(--ink-soft)}
.card .meta{margin-top:4px}

.groups{display:grid;gap:22px;grid-template-columns:1fr}
.group-col h3.gh{display:flex;align-items:center;gap:10px;font-size:19px;margin:0 0 12px}
.gh .pill{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);color:#fff8ee;font-weight:900}
.group-col[data-g="A"] .pill{background:var(--a-group)}
.group-col[data-g="B"] .pill{background:var(--b-group)}
.group-col[data-g="A"] .card{border-top-width:7px;border-top-color:var(--a-group)}
.group-col[data-g="B"] .card{border-top-width:7px;border-top-color:var(--b-group)}
.group-col .cards{grid-template-columns:1fr}
.seg{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);margin:0 0 16px;width:max-content}
.seg button{border:0;background:transparent;padding:7px 18px;cursor:pointer;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (max-width:859px){
  .groups[data-show="A"] .group-col[data-g="B"]{display:none}
  .groups[data-show="B"] .group-col[data-g="A"]{display:none}
}
@media (min-width:860px){
  .groups{grid-template-columns:1fr 1fr}
  .seg{display:none}
}

/* checklists */
.list-head{display:grid;gap:10px;margin-bottom:18px}
.list-head h2{font-size:clamp(24px,4vw,32px);font-weight:900}
.list-head p{margin:0;color:var(--ink-soft);max-width:65ch}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:var(--accent-2);border-right:2px solid var(--ink);width:0;transition:width .3s}
.progress b{font-size:15px}
.checks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.check{display:grid;grid-template-columns:auto 56px 1fr;gap:12px;align-items:center;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px 10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:8px;display:grid;place-items:center;background:var(--paper)}
.box svg{width:18px;height:18px;opacity:0;transition:opacity .15s}
.check input:checked ~ .box{background:var(--accent-2)}
.check input:checked ~ .box svg{opacity:1}
.check input:focus-visible ~ .box{outline:3px solid var(--accent);outline-offset:2px}
.check .thumb{width:56px;height:40px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--sky)}
.check .txt b{display:block;font-size:15.5px;line-height:1.35}
.check .txt span{font-size:13px;color:var(--ink-soft)}
.check.done .txt b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-soft)}
.check.noimg{grid-template-columns:auto 1fr}
.reset{margin-top:16px;border:2px solid var(--ink-soft);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--ink-soft)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.nav-inner{pointer-events:auto;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--card);border:2.5px solid var(--ink);border-radius:26px;padding:6px;box-shadow:0 4px 0 var(--line),0 10px 30px color-mix(in srgb,var(--ink) 18%,transparent)}
.nav a{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:20px;text-decoration:none;color:var(--ink-soft);font-size:12px;font-weight:700;white-space:nowrap}
@media (max-width:380px){.nav a{font-size:11px}.nav-inner{padding:5px;gap:2px}}
/* packing list */
.chip.today{background:var(--accent-2);color:#fff8ee}
.chip.today small{color:#fff8ee}
.pack-hero{display:grid;grid-template-columns:1fr;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:0 5px 0 var(--line);margin-bottom:22px}
.pack-hero .art{border-bottom:2.5px solid var(--ink)}
.pack-hero .list-head{padding:18px 20px;margin:0;align-content:center}
@media (min-width:860px){.pack-hero{grid-template-columns:1fr 1.2fr}.pack-hero .art{border-bottom:0;border-right:2.5px solid var(--ink)}.pack-hero .list-head{padding:26px 30px}}
.pack-cats{display:grid;gap:24px}
.pack-cat h3{display:flex;align-items:center;gap:10px;font-size:18px;margin:0 0 10px;flex-wrap:wrap}
.pack-cat h3 .no{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff8ee;border:2px solid var(--ink);font-size:14px;font-weight:900}
.pack-cat h3 .cnt{font-size:13px;font-weight:500;color:var(--ink-soft);background:var(--chip);border-radius:999px;padding:2px 10px}
.pack-cat.all-done h3 .cnt{background:var(--accent-2);color:#fff8ee}
.pack-cat .checks{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pack-cat .check{padding:9px 12px;border-width:2px;box-shadow:0 2px 0 var(--line)}
.nav a svg{width:24px;height:24px}
.nav a .ico{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{background:var(--accent);color:#fff8ee}

.foot{margin-top:30px;font-size:13px;color:var(--ink-soft)}
@media (max-width:420px){
  .wrap{padding-left:16px;padding-right:16px}
  .day-picker{margin:0 -16px 18px;padding:10px 16px}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
  </filter>
</svg>

<div class="wrap">
  <header class="topbar">
    <div class="brand"><span class="brand-dot" aria-hidden="true">冬</span><span>2026 東京冬令營</span></div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="切換深色或淺色模式">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="themeIco" fill="currentColor" d=""/></svg>
      <span id="themeLabel">深色</span>
    </button>
  </header>

  <main>
    <section class="view" id="view-home" aria-label="首頁"></section>
    <section class="view" id="view-trip" aria-label="行程"></section>
    <section class="view" id="view-spots" aria-label="行程確認清單"></section>
    <section class="view" id="view-prep" aria-label="出發前確認清單"></section>
    <section class="view" id="view-pack" aria-label="打包清單"></section>
  </main>
</div>

<nav class="nav" aria-label="主選單">
  <div class="nav-inner">
    <a href="#home" data-v="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ico" d="M3 11 12 4l9 7"/><path class="ico" d="M5.5 9.5V20h13V9.5"/><path class="ico" d="M10 20v-5h4v5"/></svg>首頁</a>
    <a href="#trip" data-v="trip"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ico" x="3.5" y="5" width="17" height="15" rx="3"/><path class="ico" d="M3.5 10h17M8 3v4M16 3v4"/></svg>行程</a>
    <a href="#spots" data-v="spots"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ico" d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><path class="ico" d="m9.5 10 2 2 3.5-3.5"/></svg>行程確認</a>
    <a href="#prep" data-v="prep"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ico" x="6" y="7" width="12" height="14" rx="2.5"/><path class="ico" d="M9.5 7V4.5h5V7M9.5 12h5M9.5 16h3"/></svg>出發前</a>
    <a href="#pack" data-v="pack"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ico" x="4" y="8" width="16" height="12" rx="3"/><path class="ico" d="M9 8V5.5h6V8M4 13h16M10 13v2h4v-2"/></svg>打包</a>
  </div>
</nav>

<script>
(function(){
"use strict";

/* ---------- storage (optional, per viewer) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("twc26:"+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("twc26:"+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- illustrations (hand-drawn picture-book style) ---------- */

  {name:"必需品", items:["家裡鑰匙","鼻噴劑","個人藥品","通血透骨膏"]},
  {name:"隨身用品", items:["錢包","行動電源","充電線","充電頭","雨傘","隨身水瓶","口罩","眼鏡盒","隱形眼鏡","眼藥水","環保購物袋","護唇膏","護手霜","牙線","衛生紙","爽身濕紙巾"]},
  {name:"衣著及穿搭", items:["內衣褲","外衣褲","外套","睡衣褲","襪子","皮帶","休閒鞋","飯店拖鞋","烘衣神器","髒衣袋"]},
  {name:"化妝品", items:["粉底棒","假睫毛","化妝棉","卸妝棉","卸妝蜜","眉毛夾","定妝噴霧","香水","髮蠟","定型噴霧","小剪刀","鯊魚夾"]},
  {name:"保養品", items:["化妝水","精華液","乳液","面霜","面膜"]},
  {name:"衛生用品", items:["牙刷","牙膏","棉花棒","洗髮精","Femfresh","刮鬍刀","梳子","消臭元"]}
];

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const art = k => (ART[k]||ART.plane)();
const card = (it) => `
  <article class="card">
    <div class="art">${art(it.art)}</div>
    <span class="time num">${esc(it.t)}</span>
    <div class="body">
      <h3>${esc(it.title)}</h3>
      ${it.note?`<p>${esc(it.note)}</p>`:""}
      ${(it.spot||it.opt||it.group)?`<div class="meta">${it.spot?`<span class="tag spot">地圖清單地點</span>`:""}${it.opt?`<span class="tag opt">${esc(it.opt)}</span>`:""}${it.group?`<span class="tag ${it.group.toLowerCase()}">${it.group} 組</span>`:""}</div>`:""}
    </div>
  </article>`;
const checkSvg = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff8ee" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- views ---------- */
let curDay = store.get("day","d1");
if(!DAYS.some(d=>d.id===curDay)) curDay = "d1";
let curGroup = store.get("group","A");

function renderHome(){
  const start = new Date(2026,11,13), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((start - today)/86400000);
  const countHTML = diff>0 ? `<div class="count"><span>距離出發還有</span><b class="num">${diff}</b><span>天</span></div>`
                  : diff>-7 ? `<div class="count"><b>旅途中</b><span>第 ${1-diff} 天</span></div>`
                  : `<div class="count"><b>旅程結束</b><span>辛苦了！</span></div>`;
  document.getElementById("view-home").innerHTML = `
    <div class="hero">
      <div class="hero-art">${art("hero")}</div>
      <div class="hero-body">
        <span class="eyebrow">12/13 – 12/19 · 6 晚 7 天</span>
        <h1>2026 東京冬令營</h1>
        <p>東京車站出發，到輕井澤住一晚看雪中教會，再回東京逛神宮、美術館和銀座。</p>
        ${countHTML}
      </div>
    </div>

    <h2 class="section-title">班機</h2>
    <div class="flights">
      <div class="flight">
        <div class="flight-top"><span class="flight-no">JX314</span><span>12/13（日）去程</span></div>
        <div class="route"><div><div class="t num">09:15</div><div class="p">台中 RMQ</div></div><div class="line"></div><div style="text-align:right"><div class="t num">13:25</div><div class="p">成田 NRT T2</div></div></div>
      </div>
      <div class="flight">
        <div class="flight-top"><span class="flight-no">JX315</span><span>12/19（六）回程</span></div>
        <div class="route"><div><div class="t num">14:25</div><div class="p">成田 NRT T2</div></div><div class="line"></div><div style="text-align:right"><div class="t num">17:55</div><div class="p">台中 RMQ</div></div></div>
      </div>
    </div>
    <p class="note-small">星宇冬季班表（2026/10/25 起每日飛）。請以電子機票上的時間為準。</p>

    <h2 class="section-title">每日行程</h2>
    <div class="days-grid">
      ${DAYS.map(d=>`<button class="day-tile" type="button" data-goday="${d.id}">
        <span class="mini">${art(d.art)}</span>
        <span><span class="d num">${d.date}<small>（${d.wd}）</small></span><br><span class="th">${esc(d.title)}・${esc(d.sub)}</span></span>
      </button>`).join("")}
    </div>

    <h2 class="section-title">住宿</h2>
    <div class="stay-list">
      <div class="stay"><b>TOSEI酒店 可可尼築地銀座</b><span>12/13、12/15–12/18（共 5 晚）</span></div>
      <div class="stay"><b>輕井澤英迪格酒店</b><span>12/14（1 晚）・check-in 15:00／check-out 11:00</span></div>
    </div>
    <p class="foot">營業時間與交通皆為行前查詢資料，出發前請再確認一次。</p>`;
}

function renderTrip(){
  const d = DAYS.find(x=>x.id===curDay);
  let body;
  if(d.groups){
    const col = (g) => `<div class="group-col" data-g="${g}">
        <h3 class="gh"><span class="pill">${g}</span>${esc(d.groups[g].name)}</h3>
        ${d.groups[g].note?`<p class="callout">${esc(d.groups[g].note)}</p>`:""}
        <div class="cards">${d.groups[g].items.map(card).join("")}</div>
      </div>`;
    body = `<div class="seg" role="group" aria-label="切換組別">
        <button type="button" data-g="A" aria-pressed="${curGroup==="A"}">A 組</button>
        <button type="button" data-g="B" aria-pressed="${curGroup==="B"}">B 組</button>
      </div>
      <div class="groups" data-show="${curGroup}">${col("A")}${col("B")}</div>`;
  } else {
    body = `<div class="cards">${d.items.map(card).join("")}</div>`;
  }
  document.getElementById("view-trip").innerHTML = `
    <div class="day-picker" role="group" aria-label="選擇日期">
      <button class="chip today" type="button" data-today="1" aria-label="切換到今天的行程">今天</button>
      ${DAYS.map(x=>`<button class="chip num" type="button" data-day="${x.id}" aria-pressed="${x.id===curDay}">${x.date}<small>${x.wd}</small></button>`).join("")}
    </div>
    <div class="day-head">
      <div class="art">${art(d.art)}</div>
      <div class="body">
        <span class="date num">${d.date}（${d.wd}）</span>
        <h2>${esc(d.title)}</h2>
        <div class="meta"><span class="tag">${esc(d.sub)}</span><span class="tag">住宿：${esc(d.stay)}</span></div>
      </div>
    </div>
    ${d.callout?`<p class="callout">${d.callout}</p>`:""}
    ${body}`;
  const chip = document.querySelector(`.chip[data-day="${curDay}"]`);
  if(chip && chip.scrollIntoView) chip.scrollIntoView({block:"nearest",inline:"center"});
}

function renderChecklist(viewId, key, items, opts){
  const state = store.get(key, {});
  const done = items.filter((_,i)=>state[i]).length;
  document.getElementById(viewId).innerHTML = `
    <div class="list-head">
      <h2>${opts.title}</h2>
      <p>${opts.desc}</p>
      <div class="progress"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${done}" aria-label="完成進度"><i style="width:${done/items.length*100}%"></i></div><b class="num">${done} / ${items.length}</b></div>
    </div>
    <div class="checks">
      ${items.map((it,i)=>`<label class="check${state[i]?" done":""}${it.art?"":" noimg"}" for="${key}-${i}">
        <input type="checkbox" id="${key}-${i}" data-key="${key}" data-i="${i}" ${state[i]?"checked":""}>
        <span class="box">${checkSvg}</span>
        ${it.art?`<span class="thumb">${art(it.art)}</span>`:""}
        <span class="txt"><b>${esc(it.n)}</b><span>${esc(it.d)}</span></span>
      </label>`).join("")}
    </div>
    <button class="reset" type="button" data-reset="${key}">清除勾選</button>
    <p class="foot">勾選只存在這台裝置的瀏覽器裡，不會同步給其他人。</p>`;
}
const renderSpots = () => renderChecklist("view-spots","spots",SPOTS,{title:"行程確認清單",desc:"Google 地圖清單「2026 東京冬令營」的 17 個地點，全部排進行程。去過就打勾。"});
const renderPrep = () => renderChecklist("view-prep","prep",PREP,{title:"出發前確認清單",desc:"出發前要先處理或查清楚的事。"});

function renderPack(){
  const state = store.get("pack", {});
  const total = PACK.reduce((s,c)=>s+c.items.length,0);
  const done = PACK.reduce((s,c,ci)=>s+c.items.filter((_,i)=>state[ci+"-"+i]).length,0);
  document.getElementById("view-pack").innerHTML = `
    <div class="pack-hero">
      <div class="art">${art("suitcase")}</div>
      <div class="list-head">
        <h2>打包清單</h2>
        <p>${PACK.length} 大類、共 ${total} 項。裝進行李就打勾。</p>
        <div class="progress"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-label="打包進度"><i style="width:${done/total*100}%"></i></div><b class="num">${done} / ${total}</b></div>
      </div>
    </div>
    <div class="pack-cats">
      ${PACK.map((c,ci)=>{
        const cd = c.items.filter((_,i)=>state[ci+"-"+i]).length;
        return `<section class="pack-cat${cd===c.items.length?" all-done":""}" aria-label="${esc(c.name)}">
          <h3><span class="no num">${ci+1}</span>${esc(c.name)}<span class="cnt num">${cd} / ${c.items.length}</span></h3>
          <div class="checks">
            ${c.items.map((it,i)=>{ const k=ci+"-"+i; return `<label class="check noimg${state[k]?" done":""}" for="pack-${k}">
              <input type="checkbox" id="pack-${k}" data-key="pack" data-i="${k}" ${state[k]?"checked":""}>
              <span class="box">${checkSvg}</span>
              <span class="txt"><b>${esc(it)}</b></span>
            </label>`;}).join("")}
          </div>
        </section>`;
      }).join("")}
    </div>
    <button class="reset" type="button" data-reset="pack">清除勾選</button>
    <p class="foot">勾選只存在這台裝置的瀏覽器裡，不會同步給其他人。</p>`;
}

/* today: before 12/13 → 12/13; during the trip → that day; after 12/19 → 12/19 */
function todayDayId(){
  const n = new Date();
  const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const first = new Date(2026,11,13), last = new Date(2026,11,19);
  if(t <= first) return DAYS[0].id;
  if(t >= last) return DAYS[DAYS.length-1].id;
  return DAYS[Math.round((t-first)/86400000)].id;
}

const RENDER = {spots:()=>renderSpots(), prep:()=>renderPrep(), pack:()=>renderPack()};

/* ---------- routing ---------- */
const VIEWS = ["home","trip","spots","prep","pack"];
function route(){
  let v = (location.hash||"").replace("#","");
  if(!VIEWS.includes(v)) v = "home";
  VIEWS.forEach(n=>document.getElementById("view-"+n).classList.toggle("active", n===v));
  document.querySelectorAll(".nav a").forEach(a=>{ if(a.dataset.v===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(v==="home") renderHome();
  if(v==="trip") renderTrip();
  if(v==="spots") renderSpots();
  if(v==="prep") renderPrep();
  if(v==="pack") renderPack();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e=>{
  const go = e.target.closest("[data-goday]");
  if(go){ curDay = go.dataset.goday; store.set("day",curDay); if(location.hash==="#trip") route(); else location.hash="trip"; return; }
  const td = e.target.closest("[data-today]");
  if(td){ curDay = todayDayId(); store.set("day",curDay); renderTrip(); return; }
  const chip = e.target.closest("[data-day]");
  if(chip){ curDay = chip.dataset.day; store.set("day",curDay); renderTrip(); return; }
  const seg = e.target.closest(".seg [data-g]");
  if(seg){ curGroup = seg.dataset.g; store.set("group",curGroup);
    document.querySelector(".groups").dataset.show = curGroup;
    document.querySelectorAll(".seg [data-g]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.g===curGroup)); return; }
  const rs = e.target.closest("[data-reset]");
  if(rs){ store.set(rs.dataset.reset,{}); RENDER[rs.dataset.reset](); }
});
document.addEventListener("change", e=>{
  const cb = e.target.closest("input[data-key]");
  if(!cb) return;
  const key = cb.dataset.key, st = store.get(key,{});
  st[cb.dataset.i] = cb.checked; store.set(key, st);
  RENDER[key]();
  const again = document.getElementById(cb.id); if(again) again.focus();
});

/* ---------- theme ---------- */
const MOON = "M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z";
const SUN = "M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0-5 1.2 3h-2.4zm0 20-1.2-3h2.4zM2 12l3-1.2v2.4zm20 0-3 1.2v-2.4zM4.9 4.9l3 1.3-1.7 1.7zm14.2 14.2-3-1.3 1.7-1.7zM4.9 19.1l1.3-3 1.7 1.7zM19.1 4.9l-1.3 3-1.7-1.7z";
const root = document.documentElement;
function isDark(){
  const t = root.getAttribute("data-theme");
  if(t) return t==="dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintThemeBtn(){
  const dark = isDark();
  document.getElementById("themeIco").setAttribute("d", dark?SUN:MOON);
  document.getElementById("themeLabel").textContent = dark?"淺色":"深色";
}
const saved = store.get("theme", null);
if(saved==="dark"||saved==="light") root.setAttribute("data-theme", saved);
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const next = isDark()?"light":"dark";
  root.setAttribute("data-theme", next); store.set("theme", next); paintThemeBtn();
});
if(window.matchMedia){ const mq = window.matchMedia("(prefers-color-scheme: dark)"); if(mq.addEventListener) mq.addEventListener("change", paintThemeBtn); }
new MutationObserver(paintThemeBtn).observe(root,{attributes:true,attributeFilter:["data-theme"]});
paintThemeBtn();

route();
})();
</script>
</body>
</html>
